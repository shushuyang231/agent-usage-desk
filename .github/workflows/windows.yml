name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
          architecture: x64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test readers, pricing and upgrades
        run: python -m unittest discover -s tests -v
      - name: Build the classic portable EXE
        run: .\build-windows.ps1 -Name Agent-Usage-Desk-classic-windows-x64
      - name: Ensure WebView2 Runtime is available
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client"
          )
          $installed = $keys | ForEach-Object { Get-ItemPropertyValue -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (!$installed) {
            $setup = Join-Path $env:RUNNER_TEMP MicrosoftEdgeWebview2Setup.exe
            Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|, )O=Microsoft Corporation(?:,|$)') {
              throw 'The WebView2 bootstrapper does not have a valid Microsoft signature.'
            }
            $process = Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -WindowStyle Hidden -PassThru -Wait
            if ($process.ExitCode -ne 0) { throw "WebView2 setup exited with $($process.ExitCode)" }
          }
      - name: Launch and test the Windows app
        run: node tests/smoke-windows.mjs .\dist\Agent-Usage-Desk-classic-windows-x64.exe
      - name: Record the artifact checksum
        run: |
          $file = Get-Item -LiteralPath '.\dist\Agent-Usage-Desk-classic-windows-x64.exe'
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath '.\dist\SHA256SUMS.txt' -Encoding ascii
          'Windows x64 build and packaged WebView2 smoke test passed.' >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Agent-Usage-Desk-classic-windows-x64
          path: dist/
          if-no-files-found: error
